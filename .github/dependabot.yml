# Dependabot version updates.
# - All minor/patch npm bumps arrive as ONE grouped PR each week, so merging it
#   can't leave sibling PRs conflicting on package-lock.json.
# - Major bumps come as separate PRs (related ecosystems grouped) for manual review.
# - Non-major PRs are merged automatically once CI passes (see the
#   dependabot-automerge job in the CI workflow).
# npm workspaces are handled from the root, so only "/" is listed.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      storybook-major:
        update-types: ["major"]
        patterns:
          - "storybook"
          - "@storybook/*"
          - "@chakra-ui/storybook-addon"
      eslint-major:
        update-types: ["major"]
        patterns:
          - "eslint"
          - "eslint-*"
          - "*eslint-plugin*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "@types/prettier"
      jest-major:
        update-types: ["major"]
        patterns:
          - "jest*"
          - "@types/jest"
          - "@testing-library/*"
